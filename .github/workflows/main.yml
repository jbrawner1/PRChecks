name: Kiuwan SAST

on:
  pull_request:
    types: [opened, reopened, review_requested]


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  kiuwan_sast:
    runs-on: ubuntu-latest
    env:
      APP_NAME: "Kiuwan Sample Java App Scan Demo"
      SRC_PATH: "."
      PROJECT_NAME: Test Demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Download SARIF Report From Kiuwan SAST Scan
        id: fetch_sarif
        env:
          KIUWAN_USER: ${{ secrets.KIUWAN_USER }}
          KIUWAN_PWD: ${{ secrets.KIUWAN_PWD }}
          KIUWAN_API: "https://api.kiuwan.com"
        run: |
          echo "🧩 Fetching JUnit XML for delivery code: $DELIVERY_CODE"
          curl -sSL --user "$KIUWAN_USER:$KIUWAN_PWD" \
            "$KIUWAN_API/applications/analysis/defects/export?application=PingUtil&type=sarif" -o kiuwan.sarif

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kiuwan.sarif


  
